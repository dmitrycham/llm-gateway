# Local stack for Stage 1 (spec §11). Usage: README.md, "Local stack".
#
# Reserved profiles (later tickets, not defined yet):
#   events:        kafka, webhook-dispatcher, usage-consumer (ADR-010)
#   observability: otel-collector, prometheus, grafana (ADR-011)
# The base `docker compose up --build` must keep working without them.
#
# Published ports bind to 127.0.0.1 only: plain HTTP is allowed on localhost only
# (spec §11.2).

name: llm-gateway

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      # Read by initdb/10-roles.sh on the first start of an empty volume.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set it in .env}
      APP_SERVICE_PASSWORD: ${APP_SERVICE_PASSWORD:?set it in .env}
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:?set it in .env}
      AI_WORKER_PASSWORD: ${AI_WORKER_PASSWORD:?set it in .env}
      GATEWAY_SERVICE_PASSWORD: ${GATEWAY_SERVICE_PASSWORD:?set it in .env}
    volumes:
      # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./infra/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    healthcheck:
      # -h 127.0.0.1: the temporary server of the init phase listens on the socket only,
      # so the check cannot pass before the init scripts finish.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  redis:
    image: redis:8.12.0-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies app, then ai (spec §8.4), then gateway migrations as migrator.
  # Each schema has its own version table in public: schema_migrations_<schema>.
  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # lib/pq reads these, so the password stays out of the URL: a stray `%` breaks
      # URL parsing, and the parse error prints the whole URL.
      PGDATABASE: ${POSTGRES_DB:-llm_gateway}
      PGPASSWORD: ${MIGRATOR_PASSWORD:?set it in .env}
    volumes:
      - ./services/go-api/migrations:/migrations/app:ro
      - ./services/ai-service/migrations:/migrations/ai:ro
      - ./services/gateway/migrations:/migrations/gateway:ro
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        for schema in app ai gateway; do
          echo "migrate: $$schema"
          migrate -path "/migrations/$$schema" -database \
            "postgres://migrator@postgres:5432?sslmode=disable&search_path=public&x-migrations-table=schema_migrations_$$schema" \
            up
        done

  # Health probes only until Stage 2 (internal listener :8081). Stage 2 publishes the
  # OpenAI-compatible listener on 127.0.0.1:8080.
  gateway:
    build: services/gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GATEWAY_INTERNAL_ADDR: :8081
      GATEWAY_POSTGRES_ADDR: postgres:5432
    # Ollama runs on the host (no Metal GPU in Docker on a Mac). Docker Desktop and
    # OrbStack resolve host.docker.internal themselves; Linux (CI) needs this entry.
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/internal/health/ready]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: services/ai-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AI_SERVICE_POSTGRES_HOST: postgres
      AI_SERVICE_GATEWAY_HOST: gateway
      AI_SERVICE_GATEWAY_PORT: "8081"
      AI_SERVICE_REDIS_HOST: redis
    healthcheck:
      # No curl or wget in python:slim; urlopen raises on a 503, so the check fails.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  go-api:
    build: services/go-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GO_API_HTTP_ADDR: :8090
      GO_API_LOG_LEVEL: ${GO_API_LOG_LEVEL:-info}
      GO_API_SHUTDOWN_TIMEOUT: ${GO_API_SHUTDOWN_TIMEOUT:-15s}
    ports:
      - 127.0.0.1:${GO_API_HOST_PORT:-8090}:8090
    healthcheck:
      # /health/ready comes with the database pool.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8090/health/live]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  # `docker compose down` keeps it; `docker compose down -v` deletes all data.
  postgres-data:
