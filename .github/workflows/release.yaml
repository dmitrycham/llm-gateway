name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.service }})
    # Push filters do not apply to workflow_dispatch: a manual run from another branch
    # must not publish anything.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # A finding in one service must not cancel the other scans and reports.
      fail-fast: false
      matrix:
        service: [go-api, gateway, ai-service]
    # Serialized per service and ref; queue: max keeps every pending run instead of
    # cancelling all but the newest, so no main commit loses its sha-* image and report.
    concurrency:
      group: release-${{ github.ref }}-${{ matrix.service }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # main writes only sha-* and main; a v* tag writes only its full version. No tag is
      # written by two kinds of run, so each run verifies a tag that only it pushes.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/llm-gateway-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      # v1.2.3+build.1 and v1.2.3+build.2 would both publish the same version tag.
      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: test -n "$IMAGE_VERSION" && test "v$IMAGE_VERSION" = "$GITHUB_REF_NAME"

      # Built once into the local Docker store. The push below sends this exact image, so a
      # cache miss on a mutable base tag cannot publish something Trivy never scanned.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          # Single platform without attestations: pushed as a plain manifest.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record the scanned image
        id: own
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then suffix=":${VERSION}"; else suffix=":sha-"; fi
          own="$(grep -F -- "$suffix" <<< "$TAGS" | head -n 1)"
          test -n "$own"
          echo "tag=$own" >> "$GITHUB_OUTPUT"
          echo "scanned_id=$(docker image inspect --format '{{.Id}}' "$own")" >> "$GITHUB_OUTPUT"

      # Gate: HIGH/CRITICAL with a fix. Without limit-severities-for-sarif, SARIF mode drops
      # the severity filter and a fixable LOW/MEDIUM finding would fail the build.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.own.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: 'true'

      - name: Upload Trivy results to code scanning
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

      - name: Upload Trivy report
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.service }}
          path: trivy.sarif

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An older run or a rerun must not move :main back; it still publishes its sha-* tag.
      - name: Push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          push_main=true
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tip="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$tip" != "$GITHUB_SHA" ]]; then
              push_main=false
              echo "::notice::main is at ${tip:0:12}, not ${GITHUB_SHA:0:12}: pushing only sha-*"
            fi
          fi
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if [[ "$tag" == *:main && "$push_main" != true ]]; then continue; fi
            docker image push "$tag"
          done <<< "$TAGS"

      # Classic image store: .Id is the config digest. containerd image store: .Id is the
      # digest of the stored manifest or index, which is what gets pushed.
      - name: Verify the published image is the scanned one
        env:
          OWN_TAG: ${{ steps.own.outputs.tag }}
          SCANNED_ID: ${{ steps.own.outputs.scanned_id }}
        run: |
          if docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter'; then
            kind=manifest
            published="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$OWN_TAG" | jq -er .digest)"
          else
            kind=config
            published="$(docker buildx imagetools inspect --raw "$OWN_TAG" | jq -er .config.digest)"
          fi
          echo "scanned: $SCANNED_ID, published $kind digest: $published"
          test "$SCANNED_ID" = "$published"
