# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
api/openapi/internal-ai.yaml:
  operation-4xx-response:
    - '#/paths/~1internal~1health~1live/get/responses'
    - '#/paths/~1internal~1health~1ready/get/responses'
api/openapi/gateway.yaml:
  operation-4xx-response:
    - '#/paths/~1internal~1health~1live/get/responses'
    - '#/paths/~1internal~1health~1ready/get/responses'
api/openapi/public.yaml:
  operation-4xx-response:
    - '#/paths/~1health~1live/get/responses'
    - '#/paths/~1health~1ready/get/responses'
  # The rule does not see the parent's `properties` from inside an if/then branch; every
  # name below is defined on the parent schema.
  no-required-schema-properties-undefined:
    - '#/components/schemas/MessageResult/allOf/0/then/required/0'
    - '#/components/schemas/MessageResult/allOf/0/then/required/1'
    - '#/components/schemas/MessageResult/allOf/0/then/required/2'
    - '#/components/schemas/MessageResult/allOf/0/then/required/3'
    - '#/components/schemas/MessageResult/allOf/1/then/required/0'
    - '#/components/schemas/HistoryMessage/allOf/0/then/required/0'
    - '#/components/schemas/HistoryMessage/allOf/0/then/required/1'
    - '#/components/schemas/HistoryMessage/allOf/1/then/required/0'
