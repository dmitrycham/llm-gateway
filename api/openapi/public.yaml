openapi: 3.1.0
info:
  title: Go API public and admin API
  version: 0.2.0
  summary: Public, widget and admin API of the Go API.
  description: |
    Public and admin API of the Go API (spec §7.1). This file is the source of truth
    (ADR-005): every endpoint is defined here before it is implemented.

    **Request ID.** Every response carries `X-Request-ID`, a UUIDv7 the Go API creates for
    each request. The Go API is the entry point, so it ignores any client value (spec §4.2,
    ADR-001) and passes the ID through every hop and log line. Error bodies repeat it as
    `request_id`.

    **Errors.** Every error uses the unified contract (spec §7.4):
    `{"error": {"code", "message", "retryable", "details"?}, "request_id"}`. A resource of
    another workspace or session is reported as `404 not_found`, never `403`, so its existence
    is not revealed. A malformed path ID is `400 invalid_request`.

    **Authentication.**
    - Widget: the session token from `POST /api/v1/sites/{site_key}/sessions`, sent as
      `Authorization: Bearer <token>` (ADR-006). It is bound to one session.
    - Admin: the `admin_session` cookie (`HttpOnly`, `Secure`, `SameSite=Lax`) set by
      `POST /api/v1/auth/login`. Every changing admin request also sends the CSRF token from
      the `login` (or `GET /api/v1/auth/session`) response body in `X-CSRF-Token`.
    - CORS allows only the admin UI origin (`ADMIN_UI_ORIGIN`) with credentials. Widget calls
      are same-origin from the `/embed` iframe and need no CORS.

    **Roles** (spec FR-02): `editor` can view and upload or reindex documents; everything else
    in a workspace needs `owner`. Each admin operation names its role.
  license:
    name: MIT
    identifier: MIT
servers:
  # Host port mapping for local curl examples is settled in the Compose ticket (LGW-28).
  - url: http://go-api:8090
    description: Docker Compose network

tags:
  - name: health
    description: Liveness and readiness probes. No authentication.
  - name: widget
    description: Widget iframe document, guest sessions and chat messages (FR-01, ADR-006).
  - name: auth
    description: Administrator login and logout (cookie + CSRF token).
  - name: documents
    description: Knowledge base documents and their indexing jobs (FR-03).
  - name: usage
    description: Model usage and budgets of a workspace (spec §6.3, §6.4). Owner only.
  - name: index
    description: Embedding profile of a workspace and profile migrations (spec §8.2). Owner only.
  - name: webhooks
    description: Webhook subscriptions for domain events (spec §4.6). Owner only.

paths:
  # --- Health ---------------------------------------------------------------------------------

  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the process can serve HTTP. Checks no dependencies.
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
              example:
                status: ok

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when PostgreSQL answers. Redis is optional: when it is down the Go API
        switches to local rate limits (spec §9.3) and reports `degraded: true` with 200.
        Downstream services (ai-service, gateway) are not checked, so one failing service
        does not take every pod out of rotation.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReady'
              examples:
                ready:
                  summary: All dependencies up
                  value:
                    status: ready
                    degraded: false
                    checks:
                      postgres: ok
                      redis: ok
                degraded:
                  summary: Redis down, local rate limits in use
                  value:
                    status: ready
                    degraded: true
                    checks:
                      postgres: ok
                      redis: fail
        '503':
          description: PostgreSQL is unreachable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessNotReady'
              example:
                status: not_ready
                degraded: false
                checks:
                  postgres: fail
                  redis: ok

  # --- Widget ---------------------------------------------------------------------------------

  /embed/{site_key}:
    parameters:
      - $ref: '#/components/parameters/SiteKey'
    get:
      tags: [widget]
      operationId: getWidgetDocument
      summary: Widget iframe document
      description: |
        Small HTML document loaded by the site's loader script in an iframe (ADR-006). The
        `Content-Security-Policy: frame-ancestors` header lists the site's `allowed_origins`,
        so browsers refuse to show the widget on other sites. Static assets come from `web`.
      security: []
      responses:
        '200':
          description: Widget HTML document.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Content-Security-Policy:
              required: true
              description: Contains `frame-ancestors` built from `app.sites.allowed_origins`.
              schema:
                type: string
              example: frame-ancestors https://shop.example.org
            Cache-Control:
              required: true
              description: Revalidated on every load, so `allowed_origins` changes apply at once.
              schema:
                type: string
                const: no-cache
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/sites/{site_key}/sessions:
    parameters:
      - $ref: '#/components/parameters/SiteKey'
    post:
      tags: [widget]
      operationId: createSession
      summary: Create a guest session
      description: |
        Creates a guest session for the site and returns its token once. The token is random
        (at least 256 bits), lives 24 h by default and is stored only as a hash (FR-01).

        Limited by IP + `site_key` (spec §9.2, 5 per minute and 30 per day by default). The
        `site_key` is public, so limits and budgets protect the site, not key secrecy.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example: {}
      responses:
        '201':
          description: Session created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: 0193a1f0-7c2e-7a10-9b55-3f6c2d9e8a01
                session_token: q3Jx0d8Kf2LwP1sVb7nYc4TzR9mHa6Ue5oGiN0kXjQw
                expires_at: '2026-11-27T10:15:00Z'
                limits:
                  max_messages: 50
                  max_message_length: 2000
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [widget]
      operationId: listSessionMessages
      summary: Session history
      description: |
        All messages of the caller's own session, oldest first. A session holds at most
        50 questions by default (spec §9.2), so the list is not paginated.
      security:
        - sessionToken: []
      responses:
        '200':
          description: Session messages.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
              example:
                messages:
                  - message_id: 0193a1f0-9d20-7a01-8b02-1c2d3e4f5a6b
                    role: user
                    content: What are the product return conditions?
                    status: completed
                    created_at: '2026-11-26T10:16:02Z'
                    request_id: 0193a1f0-9d12-7c33-a1b2-6f8e9d0c1b2a
                  - message_id: 0193a1f1-0a01-7d44-b2c3-7a9b8c0d1e2f
                    role: assistant
                    content: Returns are possible within 30 days if the store's conditions are met [S1].
                    status: completed
                    grounding: cited
                    sources:
                      - label: S1
                        document_id: 0193a0aa-1111-7e55-8d44-0a1b2c3d4e5f
                        chunk_id: 0193a0aa-2222-7f66-9e55-1b2c3d4e5f60
                        title: Return policy
                        section: Return periods
                        url: https://shop.example.org/returns
                        available: true
                    created_at: '2026-11-26T10:16:05Z'
                    request_id: 0193a1f0-9d12-7c33-a1b2-6f8e9d0c1b2a
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/WidgetUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [widget]
      operationId: sendMessage
      summary: Ask a question
      description: |
        Question → RAG → answer, synchronously (ADR-004). `Idempotency-Key` is required; the
        widget retries only with the same key and the same body.

        **Idempotency (spec §7.5).** Scope is the session. The Go API stores
        `sha256(session_id || key)` and the hash of the canonical JSON body for 24 h.

        | Key state | Same body | Different body |
        | --- | --- | --- |
        | none | user message saved, answer generated → `200` | — |
        | `in_progress`, lock live | `409 request_in_progress` + `Retry-After` | `422 idempotency_key_reuse` |
        | `in_progress`, lock expired | taken over: stored result, stored final error, or a new execution when there is neither a committed outcome nor a live lease | `422 idempotency_key_reuse` |
        | `completed` | stored answer → `200`, no new model call | `422 idempotency_key_reuse` |
        | `failed_retryable` | taken over, executed again | `422 idempotency_key_reuse` |
        | `failed_final` | stored error with its original status | `422 idempotency_key_reuse` |

        If the ai-service or gateway answers `409` because the first attempt still holds its
        lease, the Go API returns `409 request_in_progress` with that `Retry-After` and leaves
        the key state unchanged.

        The user message is created once, together with the key. A replayed answer keeps the
        sources of the first answer (ADR-009) and its original `request_id`.

        **Timeout.** When the deadline expires (spec §4.3) the Go API stops waiting and answers
        `504 timeout` with `details.message_id`. In the same step it sets the key to
        `failed_retryable` and the user message to `failed` with `error.code = timeout`, so
        `GET .../messages/{message_id}` never stays `accepted` after a `504`. A retry with the
        same key and body takes the key over; the gateway returns its stored result if the
        first attempt finished, so the answer is not paid twice (ADR-009).

        **Limits.** Rate limits apply to every request, replays included. A replay never gets
        `budget_exceeded` and does not count toward the session message limit.

        **Length.** `message` is limited to 2000 characters (Unicode code points). A longer
        message gets `413 message_too_long`, not `422`.
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              message: What are the product return conditions?
      responses:
        '200':
          description: The answer, new or replayed from the idempotency record.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                # The sync POST only succeeds with an answer; `accepted` and `failed` are for
                # the recovery GET.
                allOf:
                  - $ref: '#/components/schemas/MessageResult'
                  - properties:
                      status:
                        const: completed
              example:
                message_id: 0193a1f0-9d20-7a01-8b02-1c2d3e4f5a6b
                status: completed
                answer: Returns are possible within 30 days if the store's conditions are met [S1].
                grounding: cited
                sources:
                  - label: S1
                    document_id: 0193a0aa-1111-7e55-8d44-0a1b2c3d4e5f
                    chunk_id: 0193a0aa-2222-7f66-9e55-1b2c3d4e5f60
                    title: Return policy
                    section: Return periods
                    url: https://shop.example.org/returns
                    available: true
                model:
                  provider: openai
                  name: configured-chat-model
                request_id: 0193a1f0-9d12-7c33-a1b2-6f8e9d0c1b2a
                created_at: '2026-11-26T10:16:02Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/WidgetUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '413':
          $ref: '#/components/responses/MessageTooLong'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/MessageTimeout'

  /api/v1/sessions/{session_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: message_id
        in: path
        required: true
        description: ID of the user message, as returned by `POST .../messages` or a `504` body.
        schema:
          type: string
          format: uuid
    get:
      tags: [widget]
      operationId: getMessageResult
      summary: Message status and result
      description: |
        Outcome of one question, for recovery after a client timeout (ADR-004).
        - `accepted`: a request for this question is running right now (for example a retry
          from another tab). Wait `Retry-After` seconds and ask again.
        - `failed` with `error.retryable: true` (for example `timeout` after a `504`): retry
          `POST .../messages` with the same `Idempotency-Key` and body.
        - `failed` with `error.retryable: false`: final; a retry returns the same error.
      security:
        - sessionToken: []
      responses:
        '200':
          description: Current state of the question.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Retry-After:
              description: Sent only with `status = accepted`.
              schema:
                type: integer
                minimum: 0
              example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResult'
              examples:
                accepted:
                  summary: Still processing
                  value:
                    message_id: 0193a1f0-9d20-7a01-8b02-1c2d3e4f5a6b
                    status: accepted
                    request_id: 0193a1f0-9d12-7c33-a1b2-6f8e9d0c1b2a
                    created_at: '2026-11-26T10:16:02Z'
                failed:
                  summary: Failed for good
                  value:
                    message_id: 0193a1f0-9d20-7a01-8b02-1c2d3e4f5a6b
                    status: failed
                    error:
                      code: provider_error
                      message: The model provider returned an error
                      retryable: false
                    request_id: 0193a1f0-9d12-7c33-a1b2-6f8e9d0c1b2a
                    created_at: '2026-11-26T10:16:02Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/WidgetUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # --- Auth -----------------------------------------------------------------------------------

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Administrator login
      description: |
        Sets the `admin_session` cookie (8 h by default) and returns the CSRF token for
        `X-CSRF-Token`. Wrong email and wrong password give the same `401`. Rate limited by
        IP and email. A request with an `Origin` other than the Go API or `ADMIN_UI_ORIGIN`
        gets `403 origin_not_allowed` (login CSRF).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.org
              password: <ADMIN_PASSWORD>
      responses:
        '200':
          description: Logged in.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              required: true
              description: The admin session cookie.
              schema:
                type: string
              example: admin_session=Zm9vYmFy...; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              example:
                csrf_token: Hk2pV9xQ4mT7wZ1cN8bR3sL6yD0fJ5gA2eU9iO4kWqE
                expires_at: '2026-11-26T18:15:00Z'
                user:
                  user_id: 0193a000-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  email: admin@example.org
                workspaces:
                  - workspace_id: 0193a000-2b3c-7d4e-9f50-6b7c8d9e0f1a
                    name: Example shop
                    role: owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getAdminSession
      summary: Current admin session
      description: |
        Returns the current admin session with its CSRF token (the same one `login`
        returned) and the user's workspaces, so a reloaded admin UI can continue without a
        new login. Read-only: the token is not rotated, so other open tabs keep working and a
        cross-site navigation cannot invalidate it. CORS lets only `ADMIN_UI_ORIGIN` read
        the body. Not in spec §7.1 yet (LGW-26).
      security:
        - adminSession: []
      responses:
        '200':
          description: The current session.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              example:
                csrf_token: Hk2pV9xQ4mT7wZ1cN8bR3sL6yD0fJ5gA2eU9iO4kWqE
                expires_at: '2026-11-26T18:15:00Z'
                user:
                  user_id: 0193a000-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  email: admin@example.org
                workspaces:
                  - workspace_id: 0193a000-2b3c-7d4e-9f50-6b7c8d9e0f1a
                    name: Example shop
                    role: owner
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the admin session
      description: Deletes the admin session and clears the cookie.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Logged out.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Set-Cookie:
              required: true
              description: Expires the admin session cookie.
              schema:
                type: string
              example: admin_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # --- Documents ------------------------------------------------------------------------------

  /api/v1/workspaces/{workspace_id}/documents:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents
      description: Non-deleted documents of the workspace, newest first. Role `editor` or `owner`.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of documents.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
              example:
                documents:
                  - document_id: 0193a0aa-1111-7e55-8d44-0a1b2c3d4e5f
                    title: Return policy
                    active_version_id: 0193a0aa-3333-7a77-8f66-2c3d4e5f6a71
                    latest_version:
                      version_id: 0193a0aa-3333-7a77-8f66-2c3d4e5f6a71
                      version: 1
                      state: indexed
                      content_type: text/markdown
                      size_bytes: 5120
                      content_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                      created_at: '2026-11-25T09:00:00Z'
                    created_at: '2026-11-25T09:00:00Z'
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a document
      description: |
        Uploads a new document, or a new version when `document_id` is set. Role `editor` or
        `owner`. The Go API checks size (10 MB by default), the format signature, a safe file
        name, the workspace storage limit (200 MB) and active jobs (3).

        **Order.** The Go API first writes the file to a temporary file on disk (memory stays
        bounded) and hashes it while writing. Then it checks and claims the idempotency key,
        and only after that streams the staged file to the ai-service (spec §4.5). So `409`
        and `422 idempotency_key_reuse` never leave a version or job behind.

        The same content as a non-deleted document of the workspace creates nothing new: the
        response returns the existing IDs with `deduplicated: true`.

        `Idempotency-Key` is optional; its scope is the workspace (spec §7.5). The request
        hash is `sha256` of the canonical JSON `{"file_sha256", "title", "document_id"}`, where
        `title` is the effective title (the file name when none was sent) and a missing
        `document_id` is `null`.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
            encoding:
              file:
                # The type is detected from the file signature (spec §4.5), so the part's own
                # Content-Type is ignored: curl -F sends .md files as application/octet-stream.
                contentType: '*/*'
      responses:
        '202':
          description: Accepted; indexing runs in the background.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
              example:
                document_id: 0193a0aa-1111-7e55-8d44-0a1b2c3d4e5f
                version_id: 0193a0aa-3333-7a77-8f66-2c3d4e5f6a71
                job_id: 0193a0aa-4444-7b88-9a77-3d4e5f6a7b82
                deduplicated: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RequestInProgress'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/workspaces/{workspace_id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocument
      summary: Document with versions
      description: The document, all its versions and the active one. Role `editor` or `owner`.
      security:
        - adminSession: []
      responses:
        '200':
          description: The document.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                document_id: 0193a0aa-1111-7e55-8d44-0a1b2c3d4e5f
                title: Return policy
                active_version_id: 0193a0aa-3333-7a77-8f66-2c3d4e5f6a71
                versions:
                  - version_id: 0193a0ab-5555-7c99-8b88-4e5f6a7b8c93
                    version: 2
                    state: indexing
                    content_type: text/markdown
                    size_bytes: 5300
                    content_hash: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752
                    created_at: '2026-11-26T08:00:00Z'
                  - version_id: 0193a0aa-3333-7a77-8f66-2c3d4e5f6a71
                    version: 1
                    state: indexed
                    content_type: text/markdown
                    size_bytes: 5120
                    content_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    created_at: '2026-11-25T09:00:00Z'
                created_at: '2026-11-25T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document
      description: |
        Soft-deletes the document: it leaves search at once and stays in old answers as
        "source deleted" (FR-04). Role `owner`. Written to the audit log.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/workspaces/{workspace_id}/documents/{document_id}/reindex:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: reindexDocument
      summary: Reindex a document
      description: |
        Queues a reindex of the latest version. Role `editor` or `owner`. If a job for the
        document is already queued or running, returns it with `deduplicated: true`. A
        document with no stored version gets `409 conflict`.
      security:
